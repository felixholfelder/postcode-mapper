name: Postcode-mapper Pipeline

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:
    branches:
      - '*'
    tags:
      - '*'

env:
  IMAGE_NAME: felixholfelder/postcode-mapper
  VERSION: ${{ github.ref_name }}


jobs:
  qualitygate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

#      - name: Checkstyle
#        run: ./mvnw checkstyle:check
#
#      - name: PMD
#        run: ./mvnw pmd:check

  dockerize:
    runs-on: ubuntu-latest
    needs: qualitygate
#    if: github.ref_type == 'tag'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'microsoft' # See 'Supported distributions' for available options
          java-version: '17'

      - name: Clean, Install
        run: ./mvnw -Dmaven.test.skip=true clean install

      - name: Build Jar-File
        run: ./mvnw -Dmaven.test.skip=true -Drevision=${{ env.VERSION }} package

      - name: Build Docker image
        run: |
          docker build --build-arg revision=${{ env.VERSION }} . -t ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          docker build --build-arg revision=${{ env.VERSION }} . -t ${{ env.IMAGE_NAME }}:latest

      - name: Push to Dockerhub
        run: |
          docker login -u=${{ secrets.DOCKERHUB_USER }} -p=${{ secrets.DOCKERHUB_PASS }}
          docker push ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          docker push ${{ env.IMAGE_NAME }}:latest

