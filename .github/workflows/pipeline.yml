name: Postcode-mapper Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'
    tags:
      - '**'

env:
  APP_NAME: postcode-mapper
  IMAGE_NAME: felixholfelder/postcode-mapper
  VERSION: ${{ github.ref_name }}

jobs:
  qualitygate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

#      - name: Checkstyle
#        run: ./mvnw checkstyle:check
#
#      - name: PMD
#        run: ./mvnw pmd:check

  dockerize:
    runs-on: ubuntu-latest
    needs: qualitygate
    if: github.event.pull_request.user.login != 'renovate[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft' # See 'Supported distributions' for available options
          java-version: '17'

      - name: Clean, Install
        run: ./mvnw -Dmaven.test.skip=true clean install

      - name: Build Jar-File
        run: ./mvnw -Dmaven.test.skip=true -Drevision=${{ env.VERSION }} package

      - name: Build Docker image
        if: github.ref_type == 'tag' || github.ref_name == 'main'
        run: docker build --build-arg revision=${{ env.VERSION }} . -t ${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: Push to Dockerhub
        if: github.ref_type == 'tag' || github.ref_name == 'main'
        run: |
          docker login -u=${{ secrets.DOCKERHUB_USER }} -p=${{ secrets.DOCKERHUB_PASS }}
          docker push ${{ env.IMAGE_NAME }}:${{ env.VERSION }}

  deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'renovate[bot]'
    needs: dockerize
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create config
        run: |
          mkdir ${HOME}/.kube
          echo ${{ secrets.KUBE_CONFIG }} | base64 --decode > ${HOME}/.kube/config

      - name: Use context
        run: kubectl config use-context default

      - name: Deploy app
        run: kubectl set image deployments/${{ env.APP_NAME }}-deployment server=${{ env.IMAGE_NAME }}:${{ env.VERSION }} -n refuel-service
