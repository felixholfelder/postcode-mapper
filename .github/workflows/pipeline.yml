name: Postcode-Mapper Pipeline

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:
    branches:
      - '*'
    tags:
      - '*'

env:
  IMAGE_NAME: felixholfelder/postcode-mapper
  VERSION: ${{ github.ref_name }}

jobs:
  qualitygate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

  #      - name: Checkstyle
  #        run: ./mvnw checkstyle:check
  #
  #      - name: PMD
  #        run: ./mvnw pmd:check
  build:
    runs-on: ubuntu-latest
    needs: qualitygate
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'microsoft' # See 'Supported distributions' for available options
          java-version: '17'

      - name: Clean, Install
        run: ./mvnw -Dmaven.test.skip=true clean install

      - name: Build Jar-File
        run: ./mvnw -Dmaven.test.skip=true -Drevision=${{ env.VERSION }} package

      - name: Store artifacts
        uses: actions/upload-artifact@v3
        with:
          name: postcode-mapper-artifact
          path: target

  deploy:
    runs-on: ubuntu-latest
    needs: build
    #    if: github.ref_type == 'tag'
    steps:
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: target

  clean-up:
    runs-on: ubuntu-latest
    if: always()
    needs: deploy
    steps:
      - name: Delete artifacts
        uses: geekyeggo/delete-artifact@v2
        with:
          name: led-rest-artifact